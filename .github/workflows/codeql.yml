name: codeql

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
