name: cross platform audit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-candidate:
    name: build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: set up java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: validate wrapper
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: build candidate
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          expected_commit="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$expected_commit"
          ./gradlew clean test build runGameTestServer generateAuditDependencyManifest --no-configuration-cache -PsefAuditCandidateCommit="$(git rev-parse HEAD)" --console=plain
          mkdir -p build/candidate
          candidate_artifact="build/libs/$(sed -n 's/^mod_id=//p' gradle.properties | head -n 1)-$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1).jar"
          test -f "$candidate_artifact"
          cp "$candidate_artifact" build/candidate/
          candidate_name="$(basename "$candidate_artifact")"
          cp build/audit/platform-dependency-manifest.txt build/candidate/platform-dependency-manifest.txt
          grep -F "candidate_commit=$(git rev-parse HEAD)" build/candidate/platform-dependency-manifest.txt
          grep -F 'jna_runtime_owner=net.neoforged:minecraft-dependencies:1.21.1' build/candidate/platform-dependency-manifest.txt
          grep -F 'jna_runtime_coordinate=net.java.dev.jna:jna:5.14.0' build/candidate/platform-dependency-manifest.txt
          grep -F 'jna_runtime_coordinate=net.java.dev.jna:jna-platform:5.14.0' build/candidate/platform-dependency-manifest.txt
          grep -F 'candidate_mod_jar_embeds_duplicate_native_runtime=false' build/candidate/platform-dependency-manifest.txt
          (cd build/candidate && sha256sum "$candidate_name" > sha256.txt)
          (cd build/candidate && sha512sum "$candidate_name" > sha512.txt)
          printf '%s\n' "commit=$(git rev-parse HEAD)" > build/candidate/manifest.txt
          cat build/candidate/sha256.txt >> build/candidate/manifest.txt
          cat build/candidate/sha512.txt >> build/candidate/manifest.txt

      - name: upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-platform-candidate
          if-no-files-found: error
          path: build/candidate

  runtime:
    name: runtime ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-candidate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: set up java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: validate wrapper
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: download candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cross-platform-candidate
          path: cross-platform-candidate

      - name: run linux or macos audit
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          expected_commit="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$expected_commit"
          ./gradlew clean test build runAuditWriterProbe --console=plain
          ./gradlew generateAuditDependencyManifest --no-configuration-cache -PsefAuditCandidateCommit="$(git rev-parse HEAD)" --console=plain
          grep -F "candidate_commit=$(git rev-parse HEAD)" build/audit/platform-dependency-manifest.txt
          grep -F 'jna_runtime_owner=net.neoforged:minecraft-dependencies:1.21.1' build/audit/platform-dependency-manifest.txt
          grep -F 'jna_runtime_coordinate=net.java.dev.jna:jna:5.14.0' build/audit/platform-dependency-manifest.txt
          grep -F 'jna_runtime_coordinate=net.java.dev.jna:jna-platform:5.14.0' build/audit/platform-dependency-manifest.txt
          grep -F 'candidate_mod_jar_embeds_duplicate_native_runtime=false' build/audit/platform-dependency-manifest.txt
          candidate_game_dir="$GITHUB_WORKSPACE/build/candidate-runtime"
          candidate_jar="$(printf '%s\n' cross-platform-candidate/*.jar | sed -n '1p')"
          test -n "$candidate_jar"
          mkdir -p "$candidate_game_dir/mods"
          candidate_name="$(basename "$candidate_jar")"
          cp "$candidate_jar" "$candidate_game_dir/mods/$candidate_name"
          ./gradlew runCandidateGameTestServer --console=plain -PsefCandidateGameDirectory="$candidate_game_dir" 2>&1 | tee build/candidate-runtime.log
          grep -F "/mods/$candidate_name" build/candidate-runtime.log
          grep -F "All 41 required tests passed" build/candidate-runtime.log
          candidate_server_dir="$GITHUB_WORKSPACE/build/candidate-server-runtime"
          mkdir -p "$candidate_server_dir/mods"
          cp "$candidate_jar" "$candidate_server_dir/mods/$candidate_name"
          server_input_dir="$(mktemp -d)"
          server_input="$server_input_dir/stdin"
          mkfifo "$server_input"
          cleanup_server_input() { rm -rf "$server_input_dir"; }
          trap cleanup_server_input EXIT
          exec 3<> "$server_input"
          ./gradlew runCandidateServer --console=plain -PsefCandidateServerGameDirectory="$candidate_server_dir" <&3 > build/candidate-server-runtime.log 2>&1 &
          server_pid=$!
          server_ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'Done (' build/candidate-server-runtime.log 2>/dev/null; then
              server_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$server_ready" -ne 1 ]; then
            tail -n 80 build/candidate-server-runtime.log
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit 1
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            tail -n 80 build/candidate-server-runtime.log
            exit 1
          fi
          printf 'stop\n' >&3
          exec 3>&-
          server_exit=0
          wait "$server_pid" || server_exit=$?
          if [ "$server_exit" -ne 0 ]; then
            tail -n 80 build/candidate-server-runtime.log
            exit "$server_exit"
          fi
          grep -F "/mods/$candidate_name" build/candidate-server-runtime.log
          grep -F 'Done (' build/candidate-server-runtime.log
          grep -F 'Stopping server' build/candidate-server-runtime.log
          sed \
            -e "s|$GITHUB_WORKSPACE|<workspace>|g" \
            -e "s|$HOME|<home>|g" \
            build/candidate-server-runtime.log > build/candidate-server-runtime.sanitized.log
          mv build/candidate-server-runtime.sanitized.log build/candidate-server-runtime.log
          grep -F 'manifest_complete=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'append_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'native_flush_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'identity_validation_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'opened_object_identity_trace_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'object_swap_control_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'failure_preservation_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          test -s build/audit/native-writer-runtime/native-writer-identity-trace.txt
          grep -F 'same_object=true' build/audit/native-writer-runtime/native-writer-identity-trace.txt
          grep -F 'rotation_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'restart_verified=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          grep -F 'writer_stopped=true' build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
          ./gradlew dependencies --configuration runtimeClasspath --console=plain
          ./gradlew dependencyInsight --configuration runtimeClasspath --dependency net.java.dev.jna:jna --console=plain
          ./gradlew dependencyInsight --configuration runtimeClasspath --dependency net.java.dev.jna:jna-platform --console=plain

      - name: run windows audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $expectedCommit = $env:GITHUB_SHA
          if ((git rev-parse HEAD).Trim() -ne $expectedCommit) { throw 'windows checkout did not bind to the expected candidate commit' }
          .\gradlew.bat clean test build runAuditWriterProbe --console=plain
          if ($LASTEXITCODE -ne 0) { throw "windows unit and build checks failed with exit code $LASTEXITCODE" }
          $commit = (git rev-parse HEAD).Trim()
          .\gradlew.bat generateAuditDependencyManifest --no-configuration-cache "-PsefAuditCandidateCommit=$commit" --console=plain
          if ($LASTEXITCODE -ne 0) { throw "windows dependency manifest failed with exit code $LASTEXITCODE" }
          if (-not (Select-String -Path build/audit/platform-dependency-manifest.txt -Pattern "candidate_commit=$commit")) { throw 'windows dependency manifest commit binding failed' }
          if (-not (Select-String -Path build/audit/platform-dependency-manifest.txt -Pattern 'jna_runtime_owner=net\.neoforged:minecraft-dependencies:1\.21\.1')) { throw 'windows NeoForge JNA runtime owner was not recorded' }
          if (-not (Select-String -Path build/audit/platform-dependency-manifest.txt -Pattern 'jna_runtime_coordinate=net\.java\.dev\.jna:jna:5\.14\.0')) { throw 'windows JNA runtime coordinate was not recorded' }
          if (-not (Select-String -Path build/audit/platform-dependency-manifest.txt -Pattern 'jna_runtime_coordinate=net\.java\.dev\.jna:jna-platform:5\.14\.0')) { throw 'windows JNA platform runtime coordinate was not recorded' }
          if (-not (Select-String -Path build/audit/platform-dependency-manifest.txt -Pattern 'candidate_mod_jar_embeds_duplicate_native_runtime=false')) { throw 'windows duplicate native runtime scan failed' }
          $candidateGameDir = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-runtime'
          $candidateJar = Get-ChildItem 'cross-platform-candidate' -Filter '*.jar' -File | Select-Object -First 1
          if ($null -eq $candidateJar) { throw 'candidate jar was not downloaded' }
          New-Item -ItemType Directory -Force -Path (Join-Path $candidateGameDir 'mods') | Out-Null
          Copy-Item $candidateJar.FullName (Join-Path $candidateGameDir 'mods' $candidateJar.Name)
          .\gradlew.bat runCandidateGameTestServer --console=plain "-PsefCandidateGameDirectory=$candidateGameDir" 2>&1 | Tee-Object -FilePath build/candidate-runtime.log
          if ($LASTEXITCODE -ne 0) { throw "windows candidate GameTests failed with exit code $LASTEXITCODE" }
          if (-not (Select-String -Path build/candidate-runtime.log -Pattern ("mods[\\/]" + [regex]::Escape($candidateJar.Name)))) { throw 'candidate jar was not loaded from the mods directory' }
          if (-not (Select-String -Path build/candidate-runtime.log -Pattern 'All 41 required tests passed')) { throw 'packaged candidate GameTests did not pass' }
          $candidateServerDir = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-server-runtime'
          New-Item -ItemType Directory -Force -Path (Join-Path $candidateServerDir 'mods') | Out-Null
          Copy-Item $candidateJar.FullName (Join-Path $candidateServerDir 'mods' $candidateJar.Name)
          $candidateServerLog = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-server-runtime.log'
          $candidateServerRuntimeLog = Join-Path $candidateServerDir 'logs/latest.log'
          Set-Content -LiteralPath $candidateServerLog -Value ''
          $gradlePath = (Resolve-Path '.\gradlew.bat').Path
          $serverStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $serverStartInfo.FileName = $env:ComSpec
          $serverStartInfo.UseShellExecute = $false
          $serverStartInfo.CreateNoWindow = $true
          $serverStartInfo.RedirectStandardInput = $true
          $serverStartInfo.RedirectStandardOutput = $true
          $serverStartInfo.RedirectStandardError = $true
          $serverStartInfo.WorkingDirectory = (Get-Location).Path
          $serverStartInfo.Arguments = ('/d /c call "{0}" runCandidateServer --console=plain "-PsefCandidateServerGameDirectory={1}"' -f $gradlePath, $candidateServerDir)
          $serverProcess = [System.Diagnostics.Process]::new()
          $serverProcess.StartInfo = $serverStartInfo
          if (-not $serverProcess.Start()) { throw 'windows candidate dedicated server process did not start' }
          $stdoutTask = $serverProcess.StandardOutput.ReadToEndAsync()
          $stderrTask = $serverProcess.StandardError.ReadToEndAsync()
          $stopCommandSent = $false
          $serverReady = $false
          for ($i = 0; $i -lt 180; $i++) {
            if ((Test-Path -LiteralPath $candidateServerRuntimeLog -PathType Leaf) -and (Select-String -Path $candidateServerRuntimeLog -Pattern 'Done \(')) {
              $serverReady = $true
              break
            }
            if ($serverProcess.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $serverReady) {
            if (-not $serverProcess.HasExited) {
              $serverProcess.Kill($true)
              $serverProcess.WaitForExit()
            }
            if ($stdoutTask.Wait(30000)) { $stdout = $stdoutTask.GetAwaiter().GetResult() } else { $stdout = 'stdout capture timed out' }
            if ($stderrTask.Wait(30000)) { $stderr = $stderrTask.GetAwaiter().GetResult() } else { $stderr = 'stderr capture timed out' }
            [System.IO.File]::WriteAllText($candidateServerLog, $stdout + [Environment]::NewLine + $stderr)
            throw 'windows candidate dedicated server did not reach ready state within 180 seconds'
          }
          if ($serverProcess.HasExited) {
            throw 'windows candidate dedicated server exited before the stop command'
          }
          if (-not $serverProcess.HasExited) {
            $serverProcess.StandardInput.WriteLine('stop')
            $serverProcess.StandardInput.Flush()
            $stopCommandSent = $true
            if (-not $serverProcess.WaitForExit(180000)) {
              $serverProcess.Kill($true)
              $serverProcess.WaitForExit()
              throw 'windows candidate dedicated server did not stop within 180 seconds'
            }
          }
          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          [System.IO.File]::WriteAllText($candidateServerLog, "stop_command_sent=$stopCommandSent" + [Environment]::NewLine + $stdout + [Environment]::NewLine + $stderr)
          $serverExitCode = $serverProcess.ExitCode
          $serverProcess.Dispose()
          Write-Host ("candidate dedicated server stdout length " + $stdout.Length + ", stderr length " + $stderr.Length)
          if ($serverExitCode -ne 0) {
            Write-Host "candidate dedicated server process returned exit code $serverExitCode"
            @($stdout, $stderr) -join [Environment]::NewLine -split "`r?`n" |
              Where-Object { $_ -match '(?i)(BUILD|Done \(|Stopping server|Exception|Error|mods[/\\].*\.jar)' } |
              Select-Object -Last 20 |
              ForEach-Object { Write-Host $_ }
            throw "windows candidate dedicated server failed with exit code $serverExitCode"
          }
          if (-not (Select-String -Path build/candidate-server-runtime.log -Pattern ("mods[\\/]" + [regex]::Escape($candidateJar.Name)))) { throw 'candidate dedicated server did not load the jar from the mods directory' }
          if (-not (Select-String -Path build/candidate-server-runtime.log -Pattern 'Done \(')) { throw 'candidate dedicated server did not reach ready state' }
          if (-not (Select-String -Path build/candidate-server-runtime.log -Pattern 'Stopping server')) { throw 'candidate dedicated server did not stop cleanly' }
          if (-not $stopCommandSent) { Write-Host 'candidate dedicated server stopped on its own after clean startup' }
          $serverEvidence = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'build/candidate-server-runtime.log'))
          $serverEvidence = $serverEvidence.Replace($env:GITHUB_WORKSPACE, '<workspace>')
          $serverEvidence = $serverEvidence.Replace($env:RUNNER_TEMP, '<runner-temp>')
          $serverEvidence = $serverEvidence.Replace($env:USERPROFILE, '<user>')
          $serverEvidence = [regex]::Replace($serverEvidence, '(?i)(?:[A-Z]:\\Users\\[^\\\r\n ]+|/Users/[^/\r\n ]+|/home/[^/\r\n ]+)', '<user>')
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'build/candidate-server-runtime.log'), $serverEvidence)
          $probeManifest = 'build/audit/native-writer-runtime/native-writer-runtime-manifest.txt'
          foreach ($required in @('manifest_complete=true', 'append_verified=true', 'native_flush_verified=true', 'identity_validation_verified=true', 'object_swap_control_verified=true', 'rotation_verified=true', 'restart_verified=true', 'writer_stopped=true')) {
            if (-not (Select-String -Path $probeManifest -Pattern ([regex]::Escape($required)))) { throw "native writer probe did not prove $required" }
          }
          foreach ($required in @('opened_object_identity_trace_verified=true', 'failure_preservation_verified=true')) {
            if (-not (Select-String -Path $probeManifest -Pattern ([regex]::Escape($required)))) { throw "native writer probe did not prove $required" }
          }
          $identityTrace = 'build/audit/native-writer-runtime/native-writer-identity-trace.txt'
          if (-not (Test-Path -LiteralPath $identityTrace)) { throw 'native writer identity trace is missing' }
          if (-not (Select-String -Path $identityTrace -Pattern 'same_object=true')) { throw 'native writer identity trace did not prove same object' }
          .\gradlew.bat dependencies --configuration runtimeClasspath --console=plain
          if ($LASTEXITCODE -ne 0) { throw "windows dependency graph failed with exit code $LASTEXITCODE" }
          .\gradlew.bat dependencyInsight --configuration runtimeClasspath --dependency net.java.dev.jna:jna --console=plain
          if ($LASTEXITCODE -ne 0) { throw "windows jna dependency insight failed with exit code $LASTEXITCODE" }
          .\gradlew.bat dependencyInsight --configuration runtimeClasspath --dependency net.java.dev.jna:jna-platform --console=plain
          if ($LASTEXITCODE -ne 0) { throw "windows jna platform dependency insight failed with exit code $LASTEXITCODE" }

      - name: run linux or macos packaged client startup smoke
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          candidate_jar="$(printf '%s\n' cross-platform-candidate/*.jar | sed -n '1p')"
          test -n "$candidate_jar"
          client_game_dir="$GITHUB_WORKSPACE/build/candidate-client-runtime"
          client_log="$GITHUB_WORKSPACE/build/candidate-client-runtime.log"
          client_console_log="$GITHUB_WORKSPACE/build/candidate-client-console.log"
          client_runtime_log="$client_game_dir/logs/latest.log"
          mkdir -p "$client_game_dir/mods"
          candidate_name="$(basename "$candidate_jar")"
          cp "$candidate_jar" "$client_game_dir/mods/$candidate_name"
          test -f "$client_game_dir/mods/$candidate_name"
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run
            client_command=(xvfb-run -a ./gradlew runFallbackClient --console=plain "-PsefFallbackClientGameDirectory=$client_game_dir" -PsefFallbackClientUsername=SEFAuditPackaged)
          else
            client_command=(./gradlew runFallbackClient --console=plain "-PsefFallbackClientGameDirectory=$client_game_dir" -PsefFallbackClientUsername=SEFAuditPackaged)
          fi
          "${client_command[@]}" > "$client_console_log" 2>&1 &
          client_pid=$!
          startup_verified=0
          for _ in $(seq 1 180); do
            if grep -Fq 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas' "$client_runtime_log" 2>/dev/null || grep -Fq 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas' "$client_console_log" 2>/dev/null; then
              startup_verified=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          stop_tree() {
            local process_pid="$1"
            local child_pid
            for child_pid in $(pgrep -P "$process_pid" 2>/dev/null || true); do
              stop_tree "$child_pid"
            done
            kill "$process_pid" 2>/dev/null || true
          }
          stop_tree "$client_pid"
          wait "$client_pid" 2>/dev/null || true
          if [ -f "$client_runtime_log" ]; then
            cat "$client_runtime_log" > "$client_log"
            printf '\n' >> "$client_log"
            cat "$client_console_log" >> "$client_log"
          else
            cp "$client_console_log" "$client_log"
          fi
          display_blocked=0
          if [ "$RUNNER_OS" = "macOS" ] && [ "$startup_verified" -ne 1 ] && grep -Eiq '\[0x10009\]NSGL: Failed to find a suitable pixel format' "$client_log"; then
            display_blocked=1
          elif [ "$startup_verified" -ne 1 ]; then
            tail -n 80 "$client_log"
            exit 1
          fi
          if [ "$startup_verified" -eq 1 ]; then
            grep -F 'Minecraft 1.21.1' "$client_log"
            grep -F 'Backend library: LWJGL' "$client_log"
            grep -F 'ServerEssentialsForge (NeoForge 1.21.1 port) initialized' "$client_log"
            grep -F 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas' "$client_log"
          fi
          sed \
            -e "s|$GITHUB_WORKSPACE|<workspace>|g" \
            -e "s|$HOME|<home>|g" \
            "$client_log" > "$client_log.sanitized"
          mv "$client_log.sanitized" "$client_log"
          if grep -Eiq '(/home/runner|/Users/runner|/private/var|/opt/hostedtoolcache)' "$client_log"; then
            echo 'packaged client log contains a hosted path after sanitization' >&2
            exit 1
          fi
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -srm
            java -version 2>&1 | head -n 1
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "client_artifact=mods/$candidate_name"
            echo 'client_artifact_verified=true'
            if [ "$startup_verified" -eq 1 ]; then
              echo 'client_startup_verified=true'
              echo 'client_render_backend_verified=true'
              echo 'client_gui_atlas_verified=true'
            else
              echo 'client_startup_verified=false'
              echo 'client_render_backend_verified=false'
              echo 'client_gui_atlas_verified=false'
            fi
            if [ "$display_blocked" -eq 1 ]; then echo 'client_display_blocked=true'; else echo 'client_display_blocked=false'; fi
            echo 'client_log=candidate-client-runtime.log'
          } > build/client-runtime-manifest.txt

      - name: run windows packaged client startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $candidateJar = Get-ChildItem 'cross-platform-candidate' -Filter '*.jar' -File | Select-Object -First 1
          if ($null -eq $candidateJar) { throw 'candidate jar was not downloaded' }
          $clientGameDir = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-client-runtime'
          $clientLog = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-client-runtime.log'
          $clientConsoleLog = Join-Path $env:GITHUB_WORKSPACE 'build/candidate-client-console.log'
          $clientRuntimeLog = Join-Path $clientGameDir 'logs/latest.log'
          New-Item -ItemType Directory -Force -Path (Join-Path $clientGameDir 'mods') | Out-Null
          Copy-Item $candidateJar.FullName (Join-Path $clientGameDir 'mods' $candidateJar.Name)
          if (-not (Test-Path -LiteralPath (Join-Path $clientGameDir 'mods' $candidateJar.Name) -PathType Leaf)) { throw 'candidate jar was not copied into the client mods directory' }
          Set-Content -LiteralPath $clientLog -Value ''
          $gradlePath = (Resolve-Path '.\gradlew.bat').Path
          $clientStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $clientStartInfo.FileName = $env:ComSpec
          $clientStartInfo.UseShellExecute = $false
          $clientStartInfo.CreateNoWindow = $true
          $clientStartInfo.RedirectStandardOutput = $true
          $clientStartInfo.RedirectStandardError = $true
          $clientStartInfo.WorkingDirectory = (Get-Location).Path
          $clientStartInfo.Arguments = ('/d /c call "{0}" runFallbackClient --console=plain "-PsefFallbackClientGameDirectory={1}" -PsefFallbackClientUsername=SEFAuditPackaged' -f $gradlePath, $clientGameDir)
          $clientProcess = [System.Diagnostics.Process]::new()
          $clientProcess.StartInfo = $clientStartInfo
          if (-not $clientProcess.Start()) { throw 'windows packaged client process did not start' }
          $stdoutTask = $clientProcess.StandardOutput.ReadToEndAsync()
          $stderrTask = $clientProcess.StandardError.ReadToEndAsync()
          $startupVerified = $false
          for ($i = 0; $i -lt 180; $i++) {
            if ((Test-Path -LiteralPath $clientRuntimeLog -PathType Leaf) -and (Select-String -Path $clientRuntimeLog -Pattern 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas')) {
              $startupVerified = $true
              break
            }
            if ($clientProcess.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          $clientCompleted = $clientProcess.HasExited
          if (-not $clientCompleted) {
            $clientProcess.Kill($true)
            $clientProcess.WaitForExit()
          }
          if ($stdoutTask.Wait(30000)) { $stdout = $stdoutTask.GetAwaiter().GetResult() } else { $stdout = 'stdout capture timed out' }
          if ($stderrTask.Wait(30000)) { $stderr = $stderrTask.GetAwaiter().GetResult() } else { $stderr = 'stderr capture timed out' }
          [System.IO.File]::WriteAllText($clientConsoleLog, $stdout + [Environment]::NewLine + $stderr)

          function Read-TextWithRetry([string] $path) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                return [System.IO.File]::ReadAllText($path)
              } catch [System.IO.IOException] {
                if ($attempt -eq 29) { throw }
                Start-Sleep -Seconds 2
              }
            }
            throw "could not read locked file $path"
          }

          if (Test-Path -LiteralPath $clientRuntimeLog -PathType Leaf) {
            $runtimeEvidence = Read-TextWithRetry $clientRuntimeLog
            [System.IO.File]::WriteAllText($clientLog, $runtimeEvidence + [Environment]::NewLine + $stdout + [Environment]::NewLine + $stderr)
          } else {
            Copy-Item -LiteralPath $clientConsoleLog -Destination $clientLog -Force
          }
          $clientProcess.Dispose()
          $clientEvidence = Read-TextWithRetry $clientLog
          $clientEvidence = $clientEvidence.Replace($env:GITHUB_WORKSPACE, '<workspace>')
          $clientEvidence = $clientEvidence.Replace($env:RUNNER_TEMP, '<runner-temp>')
          $clientEvidence = $clientEvidence.Replace($env:USERPROFILE, '<user>')
          $clientEvidence = [regex]::Replace($clientEvidence, '(?i)(?:[A-Z]:\\Users\\[^\\\r\n ]+|/Users/[^/\r\n ]+|/home/[^/\r\n ]+)', '<user>')
          [System.IO.File]::WriteAllText($clientLog, $clientEvidence)
          $displayBlocked = $false
          if (-not $startupVerified -and (Select-String -Path $clientLog -Pattern '(?i)\[0x10006\]WGL: The driver does not appear to support OpenGL')) {
            $displayBlocked = $true
          } elseif (-not $startupVerified) {
            Get-Content -LiteralPath $clientLog -Tail 80
            throw 'packaged client startup did not reach a verified state'
          }
          if ($startupVerified) {
            foreach ($required in @('Minecraft 1.21.1', 'Backend library: LWJGL', 'ServerEssentialsForge (NeoForge 1.21.1 port) initialized', 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas')) {
              if (-not (Select-String -Path $clientLog -Pattern ([regex]::Escape($required)))) { throw "packaged client startup did not prove $required" }
            }
          }
          if (Select-String -Path $clientLog -Pattern '(?i)(/home/runner|/Users/runner|/private/var|/opt/hostedtoolcache)') { throw 'packaged client log contains a hosted path after sanitization' }
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            (Get-ComputerInfo -Property WindowsProductName,WindowsVersion | Out-String).Trim()
            (java -version 2>&1 | Select-Object -First 1)
            "candidate_commit=$((git rev-parse HEAD).Trim())"
            "client_artifact=mods/$($candidateJar.Name)"
            "client_artifact_verified=$([bool](Test-Path -LiteralPath (Join-Path $clientGameDir 'mods' $candidateJar.Name) -PathType Leaf))".ToLower()
            "client_startup_verified=$startupVerified".ToLower()
            "client_render_backend_verified=$startupVerified".ToLower()
            "client_gui_atlas_verified=$startupVerified".ToLower()
            "client_display_blocked=$displayBlocked".ToLower()
            'client_log=candidate-client-runtime.log'
          ) | Set-Content build/client-runtime-manifest.txt

      - name: inspect linux or macos artifact
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          artifact="$(printf '%s\n' cross-platform-candidate/*.jar | sed -n '1p')"
          host_artifact="$(printf '%s\n' build/libs/*.jar | sed -n '1p')"
          test -n "$artifact"; test -n "$host_artifact"
          scan_jar() {
            local label="$1"; local jar_path="$2"; local listing
            unzip -t "$jar_path" >/dev/null
            listing="$(jar tf "$jar_path")"
            if printf '%s\n' "$listing" | grep -Ei '(^|/)(com/sun/jna/|jnidispatch/|jna-platform/|jna(-platform)?(-[^/]*)?\.jar$|.*\.(dll|dylib|so)$)' >/dev/null; then
              echo "duplicate native runtime entries found in $label" >&2
              return 1
            fi
          }
          scan_jar candidate "$artifact"
          scan_jar host "$host_artifact"
          if [ "$RUNNER_OS" = "macOS" ]; then
            checksum256() { shasum -a 256 "$1"; }
            checksum512() { shasum -a 512 "$1"; }
          else
            checksum256() { sha256sum "$1"; }
            checksum512() { sha512sum "$1"; }
          fi
          checksum256 "$artifact" | tee build/cross-platform-audit.sha256
          checksum512 "$artifact" | tee build/cross-platform-audit.sha512
          checksum256 "$host_artifact" | tee build/cross-platform-host-build.sha256
          checksum512 "$host_artifact" | tee build/cross-platform-host-build.sha512
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -srm
            java -version 2>&1 | head -n 1
            git rev-parse HEAD
            echo "artifact=$artifact"
            echo "candidate_runtime=mods/$(basename "$artifact")"
            echo "candidate_runtime_verified=true"
            echo "candidate_dedicated_server_verified=true"
            echo "candidate_dedicated_server_log=candidate-server-runtime.log"
            client_runtime_verified="$(sed -n 's/^client_startup_verified=//p' build/client-runtime-manifest.txt)"
            client_runtime_blocked="$(sed -n 's/^client_display_blocked=//p' build/client-runtime-manifest.txt)"
            test -n "$client_runtime_verified"
            echo "client_runtime_verified=$client_runtime_verified"
            echo "client_runtime_blocked=$client_runtime_blocked"
            echo "client_runtime_manifest=client-runtime-manifest.txt"
            echo "client_runtime_log=candidate-client-runtime.log"
            echo "native_writer_identity_trace=native-writer-identity-trace.txt"
            cat build/cross-platform-audit.sha256
            cat build/cross-platform-audit.sha512
            echo "host_build_artifact=$host_artifact"
            cat build/cross-platform-host-build.sha256
            cat build/cross-platform-host-build.sha512
          } > build/cross-platform-audit-manifest.txt

      - name: inspect windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem 'cross-platform-candidate' -Filter '*.jar' -File | Select-Object -First 1
          $hostArtifact = Get-ChildItem 'build/libs' -Filter '*.jar' -File | Select-Object -First 1
          if ($null -eq $artifact -or $null -eq $hostArtifact) { throw 'candidate or host jar is missing' }
          function Test-JarIntegrity([string] $path) {
            $temp = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $temp | Out-Null
            try {
              Push-Location $temp
              & jar xf $path
              if ($LASTEXITCODE -ne 0) { throw "jar integrity extraction failed for $path with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
              Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Test-JarIntegrity $artifact.FullName
          Test-JarIntegrity $hostArtifact.FullName
          function Get-JarEntries([string] $path) {
            $entries = (& jar tf $path 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "jar integrity listing failed for $path with exit code $LASTEXITCODE" }
            return @($entries -split "`r?`n" | Where-Object { $_ -ne '' })
          }
          $nativePattern = '(?i)(^|/)(com/sun/jna/|jnidispatch/|jna-platform/|(jna|jna-platform)(-[^/]*)?\.jar$|.*\.(dll|dylib|so)$)'
          $artifactEntries = Get-JarEntries $artifact.FullName
          $hostEntries = Get-JarEntries $hostArtifact.FullName
          if ($artifactEntries | Where-Object { $_ -match $nativePattern }) { throw 'duplicate native runtime entries found in candidate jar' }
          if ($hostEntries | Where-Object { $_ -match $nativePattern }) { throw 'duplicate native runtime entries found in host jar' }
          $sha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          $sha512 = (Get-FileHash $artifact -Algorithm SHA512).Hash.ToLower()
          $hostSha256 = (Get-FileHash $hostArtifact -Algorithm SHA256).Hash.ToLower()
          $hostSha512 = (Get-FileHash $hostArtifact -Algorithm SHA512).Hash.ToLower()
          $clientManifest = Get-Content -LiteralPath 'build/client-runtime-manifest.txt'
          $clientRuntimeVerified = (($clientManifest | Select-String '^client_startup_verified=').Line -split '=', 2)[1]
          $clientRuntimeBlocked = (($clientManifest | Select-String '^client_display_blocked=').Line -split '=', 2)[1]
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            (Get-ComputerInfo -Property WindowsProductName,WindowsVersion | Out-String).Trim()
            (java -version 2>&1 | Select-Object -First 1)
            (git rev-parse HEAD)
            "artifact=cross-platform-candidate/$($artifact.Name)"
            "candidate_runtime=mods/$($artifact.Name)"
            "candidate_runtime_verified=true"
            "candidate_dedicated_server_verified=true"
            "candidate_dedicated_server_log=candidate-server-runtime.log"
            "client_runtime_verified=$clientRuntimeVerified"
            "client_runtime_blocked=$clientRuntimeBlocked"
            "client_runtime_manifest=client-runtime-manifest.txt"
            "client_runtime_log=candidate-client-runtime.log"
            "native_writer_identity_trace=native-writer-identity-trace.txt"
            "sha256=$sha256"
            "sha512=$sha512"
            "host_build_artifact=build/libs/$($hostArtifact.Name)"
            "host_build_sha256=$hostSha256"
            "host_build_sha512=$hostSha512"
          ) | Set-Content build/cross-platform-audit-manifest.txt

      - name: upload sanitized audit manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-platform-audit-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/cross-platform-audit-manifest.txt
            build/audit/platform-dependency-manifest.txt
            build/audit/native-writer-runtime/native-writer-runtime-manifest.txt
            build/audit/native-writer-runtime/native-writer-identity-trace.txt
            build/client-runtime-manifest.txt
            build/candidate-client-runtime.log
            build/candidate-server-runtime.log
