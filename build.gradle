plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    // FTB Essentials / FTB Library + Curios — via CurseMaven for reliable mod-jar resolution
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    fallbackRuntime {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            if (providers.gradleProperty('sefClientGameDirectory').isPresent()) {
                gameDirectory = file(providers.gradleProperty('sefClientGameDirectory').get())
            }
            if (providers.gradleProperty('sefClientQuickPlayServer').isPresent()) {
                programArguments.addAll(
                        '--quickPlayMultiplayer',
                        providers.gradleProperty('sefClientQuickPlayServer').get())
            }
            if (providers.gradleProperty('sefClientUsername').isPresent()) {
                programArguments.addAll(
                        '--username',
                        providers.gradleProperty('sefClientUsername').get())
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        fallbackClient {
            client()
            loadedMods = []
            sourceSet = sourceSets.fallbackRuntime

            if (providers.gradleProperty('sefFallbackClientGameDirectory').isPresent()) {
                gameDirectory = file(providers.gradleProperty('sefFallbackClientGameDirectory').get())
            }
            if (providers.gradleProperty('sefFallbackClientQuickPlayServer').isPresent()) {
                programArguments.addAll(
                        '--quickPlayMultiplayer',
                        providers.gradleProperty('sefFallbackClientQuickPlayServer').get())
            }
            if (providers.gradleProperty('sefFallbackClientUsername').isPresent()) {
                programArguments.addAll(
                        '--username',
                        providers.gradleProperty('sefFallbackClientUsername').get())
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config exercises a packaged candidate from the game directory mods folder.
        // It deliberately omits the local source mod so the packaged jar is the loaded mod.
        candidateGameTestServer {
            type = "gameTestServer"
            loadedMods = []
            sourceSet = sourceSets.fallbackRuntime
            gameDirectory = file(providers.gradleProperty('sefCandidateGameDirectory').orElse('run-candidate').get())
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache', '.cache/**'
}


dependencies {
    // Native audit descriptor checks use the JNA API already supplied by the pinned NeoForge runtime.
    // Keep this compile only so the mod does not embed a second native runtime.
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.14.0'

    // --- Optional integration APIs (compile-time only; each guarded at runtime via ModList.isLoaded) ---
    // LuckPerms platform-agnostic API — unchanged at 5.4 for 1.21.1 (Maven Central)
    compileOnly 'net.luckperms:api:5.4'
    // FTB Essentials (nickname + mute integration) — NeoForge 1.21.1, 2101.1.9 (CurseForge file 7608733)
    compileOnly('curse.maven:ftb-essentials-410811:7608733') { transitive = false }
    // Curios (invsee Curios slots + banned-item scanning) — NeoForge 1.21.1 (CurseForge curios file 6529130)
    compileOnly('curse.maven:curios-309927:6529130') { transitive = false }

    // --- Unit tests (JUnit 5) — pure-logic invariant tests (e.g. vanish visibility, MC-free) ---
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Run unit tests on the JUnit 5 platform.
test {
    useJUnitPlatform()
    if (gradle.startParameter.taskNames.any {
        it == 'generateProjectReferences' || it.endsWith(':generateProjectReferences')
    }) {
        systemProperty 'sef.updateProjectReferences', 'true'
    }
    if (gradle.startParameter.taskNames.any {
        it == 'generatePerformanceReport' || it.endsWith(':generatePerformanceReport')
    }) {
        systemProperty 'sef.updatePerformanceReport', 'true'
    }
    if (System.getProperty('sef.audit.evidenceRoot') != null) {
        systemProperty 'sef.audit.evidenceRoot', System.getProperty('sef.audit.evidenceRoot')
    }
}

tasks.register('generateProjectReferences') {
    dependsOn test
}

tasks.register('generateAuditInventory') {
    description = 'Generate the sanitized Phase 000 audit inventory bundle.'
    dependsOn test
    outputs.upToDateWhen { false }
    doFirst {
        if (System.getProperty('sef.audit.evidenceRoot') == null
                || System.getProperty('sef.audit.evidenceRoot').trim().isEmpty()) {
            throw new GradleException('generateAuditInventory requires -Dsef.audit.evidenceRoot=<approved external root>')
        }
    }
}

tasks.register('generateAuditDependencyManifest') {
    description = 'Generate a sanitized candidate and platform dependency manifest.'
    notCompatibleWithConfigurationCache('Captures resolved dependency metadata for an external audit manifest.')
    dependsOn tasks.named('jar')
    outputs.upToDateWhen { false }
    def manifest = layout.buildDirectory.file('audit/platform-dependency-manifest.txt')
    outputs.file(manifest)
    def projectVersion = project.version.toString()
    def modId = project.findProperty('mod_id')?.toString() ?: 'unknown'
    def minecraftVersion = project.findProperty('minecraft_version')?.toString() ?: 'unknown'
    def neoForgeVersion = project.findProperty('neo_version')?.toString() ?: 'unknown'
    def candidateCommit = providers.gradleProperty('sefAuditCandidateCommit')
            .orElse(providers.environmentVariable('GITHUB_SHA'))
            .orElse('unknown')
            .get()
    def archivesName = project.base.archivesName.get()
    def configurationsToCapture = [
            'compileClasspath',
            'runtimeClasspath',
            'fallbackRuntimeRuntimeClasspath',
            'testRuntimeClasspath'
    ]
    doLast {
        File output = manifest.get().asFile
        output.parentFile.mkdirs()
        def digest = { File file, String algorithm ->
            java.security.MessageDigest messageDigest = java.security.MessageDigest.getInstance(algorithm)
            file.withInputStream { input ->
                byte[] buffer = new byte[16 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    if (read > 0) {
                        messageDigest.update(buffer, 0, read)
                    }
                }
            }
            messageDigest.digest().collect { byte value -> String.format('%02x', value & 0xff) }.join()
        }
        def coordinate = { artifact ->
            def module = artifact.moduleVersion.id
            "${module.group}:${module.name}:${module.version}"
        }
        def dependencyPaths = { configuration ->
            def pathsByCoordinate = [:].withDefault { [] as Set }
            def visit
            visit = { dependency, path, ancestors ->
                def current = "${dependency.moduleGroup}:${dependency.moduleName}:${dependency.moduleVersion}"
                def nextPath = path + current
                if (!ancestors.add(current)) {
                    return
                }
                pathsByCoordinate[current] << nextPath.join(' -> ')
                dependency.children.toList().sort { left, right ->
                    "${left.moduleGroup}:${left.moduleName}:${left.moduleVersion}" <=>
                            "${right.moduleGroup}:${right.moduleName}:${right.moduleVersion}"
                }.each { child ->
                    visit(child, nextPath, new LinkedHashSet<>(ancestors))
                }
            }
            configuration.resolvedConfiguration.firstLevelModuleDependencies.toList().sort { left, right ->
                "${left.moduleGroup}:${left.moduleName}:${left.moduleVersion}" <=>
                        "${right.moduleGroup}:${right.moduleName}:${right.moduleVersion}"
            }.each { dependency ->
                visit(dependency, [], new LinkedHashSet<>())
            }
            pathsByCoordinate
        }
        def lines = [
                'manifest_version=1',
                "project_version=${projectVersion}",
                "mod_id=${modId}",
                "minecraft_version=${minecraftVersion}",
                "neoforge_version=${neoForgeVersion}",
                "java_version=${System.getProperty('java.version')}",
                "os_name=${System.getProperty('os.name')}",
                "os_arch=${System.getProperty('os.arch')}",
                "candidate_commit=${candidateCommit}",
                'jna_declaration=compileOnly',
                'jna_runtime_owner=unresolved'
        ]
        def artifacts = []
        def jnaRuntimePaths = [] as Set
        configurationsToCapture.each { configurationName ->
            def configuration = configurations.findByName(configurationName)
            if (configuration != null && configuration.canBeResolved) {
                def pathsByCoordinate = dependencyPaths(configuration)
                configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    File file = artifact.file
                    if (file.isFile()) {
                        def artifactCoordinate = coordinate(artifact)
                        def paths = pathsByCoordinate[artifactCoordinate].toList().sort()
                        artifacts << [
                                configuration: configurationName,
                                coordinate: artifactCoordinate,
                                fileName: file.name,
                                size: file.length(),
                                sha256: digest(file, 'SHA-256'),
                                sha512: digest(file, 'SHA-512'),
                                paths: paths
                        ]
                        if (configurationName == 'runtimeClasspath'
                                && artifactCoordinate.startsWith('net.java.dev.jna:')) {
                            jnaRuntimePaths.addAll(paths)
                        }
                    }
                }
            }
        }
        artifacts.sort { left, right ->
            [left.configuration, left.coordinate, left.fileName].join('\u0000') <=>
                    [right.configuration, right.coordinate, right.fileName].join('\u0000')
        }.each { artifact ->
            def pathText = artifact.paths.isEmpty()
                    ? "variant_component:${artifact.coordinate}"
                    : artifact.paths.join(' || ')
            lines << "artifact=${artifact.configuration}|${artifact.coordinate}|${artifact.fileName}|${artifact.size}|sha256:${artifact.sha256}|sha512:${artifact.sha512}|paths:${pathText}"
        }

        def expectedJnaCoordinates = [
                'net.java.dev.jna:jna:5.14.0',
                'net.java.dev.jna:jna-platform:5.14.0'
        ] as Set
        def runtimeJnaCoordinates = artifacts.findAll { artifact ->
            artifact.configuration == 'runtimeClasspath'
                    && artifact.coordinate.startsWith('net.java.dev.jna:')
        }.collect { artifact -> artifact.coordinate.toString() } as Set
        if (!runtimeJnaCoordinates.containsAll(expectedJnaCoordinates)) {
            throw new GradleException(
                    "runtimeClasspath must resolve both pinned NeoForge JNA artifacts. "
                            + "expected=${expectedJnaCoordinates.toList().sort()}, "
                            + "resolved=${runtimeJnaCoordinates.toList().sort()}")
        }
        expectedJnaCoordinates.toList().sort().each { jnaCoordinate ->
            lines << "jna_runtime_coordinate=${jnaCoordinate}"
        }

        def runtimeOwner = jnaRuntimePaths.collectMany { path ->
            path.split(' -> ').toList()
        }.find { component -> component.startsWith('net.neoforged:minecraft-dependencies:') }
        if (runtimeOwner != 'net.neoforged:minecraft-dependencies:1.21.1') {
            throw new GradleException(
                    "runtime JNA ownership must resolve through the pinned NeoForge runtime. "
                            + "resolved=${runtimeOwner ?: 'unresolved'}")
        }
        lines[lines.findIndexOf { it.startsWith('jna_runtime_owner=') }] =
                "jna_runtime_owner=${runtimeOwner ?: 'unresolved'}"
        jnaRuntimePaths.toList().sort().each { path -> lines << "jna_runtime_path=${path}" }

        File candidate = layout.buildDirectory.file("libs/${archivesName}-${projectVersion}.jar").get().asFile
        if (candidate.isFile()) {
            def nativeEntryPattern = java.util.regex.Pattern.compile(
                    '(?i)(^|/)(com/sun/jna/|jnidispatch/|jna-platform/|(?:jna|jna-platform)(?:-[^/]*)?\\.jar$|.*\\.(dll|dylib|so)$)')
            boolean duplicateNativeRuntime = false
            int entryCount = 0
            new java.util.zip.ZipFile(candidate).withCloseable { zip ->
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    String name = entries.nextElement().name
                    entryCount++
                    if (nativeEntryPattern.matcher(name).find()) {
                        duplicateNativeRuntime = true
                    }
                }
            }
            lines << "candidate_mod_jar=${candidate.name}"
            lines << "candidate_mod_jar_size=${candidate.length()}"
            lines << "candidate_mod_jar_sha256=${digest(candidate, 'SHA-256')}"
            lines << "candidate_mod_jar_sha512=${digest(candidate, 'SHA-512')}"
            lines << "candidate_mod_jar_entry_count=${entryCount}"
            lines << "candidate_mod_jar_embeds_duplicate_native_runtime=${duplicateNativeRuntime}"
        } else {
            lines << 'candidate_mod_jar=missing'
            lines << 'candidate_mod_jar_embeds_duplicate_native_runtime=unknown'
        }
        java.nio.file.Files.writeString(
                output.toPath(),
                lines.join(System.lineSeparator()) + System.lineSeparator(),
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

tasks.register('generatePerformanceReport') {
    dependsOn test
}

tasks.named('runServer') {
    standardInput = System.in
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
