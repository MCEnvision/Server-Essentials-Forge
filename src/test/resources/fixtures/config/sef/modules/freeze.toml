# Controls freeze behavior, presentation, bounds, storage, and diagnostics.
# Generated schema version 1.
# This file cannot grant permissions or execute commands.
schema_version = 1
module_id = "freeze"
documentation_version = 2

[module]
# Enables the module after dependency validation. `true` or `false` Apply class live.
enabled = true
# Defines truthful behavior while this module is disabled. `command_unavailable`, `provider_fallback`, `read_only` Apply class live.
disabled_behavior = "command_unavailable"

[gui]
# Selects enhanced GUI presentation without changing command access. `command_only`, `gui_preferred`, `inherit`, `off`, `on` Apply class live.
mode = "inherit"
# Allows eligible bare command routes to prefer a dedicated workflow. `true` or `false` Apply class live.
bare_command_opens = true
# Selects the stable default workflow page. 1 through 64 characters, pattern `[a-z0-9_]+` Apply class live.
default_page = "overview"

[limits]
# Bounds persisted records owned by this module. 1 through 100000 Apply class live.
maximum_records = 1000
# Bounds command and GUI result pages. 4 through 100 Apply class live.
maximum_page_size = 45

[rate]
# Bounds admission attempts independently of permission cooldown duration. 1 through 10000 Apply class live.
maximum_actions_per_minute = 30

[storage]
# Defines bounded data retention where the module owns persistent records. 0 through 3650 Apply class live.
retention_days = 90

[failure]
# Defines provider and validation failure behavior. `fail_closed`, `previous_known_good`, `read_only` Apply class live.
mode = "fail_closed"

[audit]
# Defines the minimum audit class for module actions. `admin_action`, `destructive`, `metadata_only`, `none` Apply class live.
class = "admin_action"
# Defines the module redaction class. `security_critical`, `sensitive`, `standard` Apply class live.
redaction = "sensitive"

[runtime]
# Freeze system (/freeze, /unfreeze) `true` or `false` Apply class restart_required.
enable_freeze_system = true
# Message when a frozen player tries to interact/mine/etc 0 through 8192 characters Apply class live.
freeze_action_blocked_msg = "&cYou are frozen and cannot do that."
# Notification sent to admins when a player is frozen. Placeholders: $player, $admin, $reason, $duration 0 through 8192 characters Apply class live.
freeze_admin_notify_format = "&e$admin &7has frozen &e$player &7for &e$duration&7. Reason: &f$reason"
# Allow frozen players to chat (so they can respond to the admin) `true` or `false` Apply class live.
freeze_allow_chat = true
# Message when a frozen player tries to use a command 0 through 8192 characters Apply class live.
freeze_command_blocked_msg = "&cYou are frozen and cannot use commands. Please respond in chat."
# Message sent to the player when they are frozen. Placeholders: $reason, $admin, $duration 0 through 8192 characters Apply class live.
freeze_message_to_player = "&c&l⚠ YOU HAVE BEEN FROZEN ⚠\n&7Reason: &f$reason\n&7Frozen by: &e$admin\n&7Duration: &e$duration\n&7&oPlease respond to the admin in chat."
# Play a sound when a player is frozen `true` or `false` Apply class live.
freeze_play_sound = true
# Format of the reason displayed. Placeholder: $reason 0 through 8192 characters Apply class live.
freeze_reason_format = "&c&lFROZEN &7- &f$reason"
# Periodic reminder message to frozen players. Placeholders: $reason, $admin 0 through 8192 characters Apply class live.
freeze_reminder_format = "&c&l⚠ You are still frozen! &7Reason: &f$reason &7- Please respond in chat."
# How often (seconds) to remind frozen players (0 = no reminders) 0 through 3600 Apply class live.
freeze_reminder_interval_seconds = 15
