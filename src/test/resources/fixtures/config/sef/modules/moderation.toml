# Controls moderation behavior, presentation, bounds, storage, and diagnostics.
# Generated schema version 1.
# This file cannot grant permissions or execute commands.
schema_version = 1
module_id = "moderation"
documentation_version = 2

[module]
# Enables the module after dependency validation. `true` or `false` Apply class live.
enabled = true
# Defines truthful behavior while this module is disabled. `command_unavailable`, `provider_fallback`, `read_only` Apply class live.
disabled_behavior = "command_unavailable"

[gui]
# Selects enhanced GUI presentation without changing command access. `command_only`, `gui_preferred`, `inherit`, `off`, `on` Apply class live.
mode = "inherit"
# Allows eligible bare command routes to prefer a dedicated workflow. `true` or `false` Apply class live.
bare_command_opens = true
# Selects the stable default workflow page. 1 through 64 characters, pattern `[a-z0-9_]+` Apply class live.
default_page = "overview"

[limits]
# Bounds persisted records owned by this module. 1 through 100000 Apply class live.
maximum_records = 1000
# Bounds command and GUI result pages. 4 through 100 Apply class live.
maximum_page_size = 45

[rate]
# Bounds admission attempts independently of permission cooldown duration. 1 through 10000 Apply class live.
maximum_actions_per_minute = 300

[storage]
# Defines bounded data retention where the module owns persistent records. 0 through 3650 Apply class live.
retention_days = 90

[failure]
# Defines provider and validation failure behavior. `fail_closed`, `previous_known_good`, `read_only` Apply class live.
mode = "previous_known_good"

[audit]
# Defines the minimum audit class for module actions. `admin_action`, `destructive`, `metadata_only`, `none` Apply class live.
class = "metadata_only"
# Defines the module redaction class. `security_critical`, `sensitive`, `standard` Apply class live.
redaction = "sensitive"

[runtime]
# Banned items system (/banned ...) `true` or `false` Apply class restart_required.
enable_banned_items = true
# Clear chat (/cc, /clearchat) `true` or `false` Apply class restart_required.
enable_clear_chat = true
# Ban, kick, IP moderation, and moderation history `true` or `false` Apply class restart_required.
enable_moderation_essentials = true
# Address provider. direct, trusted_proxy, external, or disabled. Restart required. 0 through 8192 characters Apply class restart_required.
moderation_address_provider = "direct"
# Permit console to enter a literal address `true` or `false` Apply class live.
moderation_allow_literal_console_addresses = true
# Permit players with the literal address permission to enter a literal address `true` or `false` Apply class live.
moderation_allow_literal_player_addresses = false
# Lifetime of destructive mass action confirmation tokens 10 through 300 Apply class live.
moderation_confirmation_seconds = 30
# Disconnect reason used when no reason is supplied 0 through 8192 characters Apply class live.
moderation_default_kick_reason = "Removed by an administrator."
# Disable shared address actions when a likely unconfigured proxy is detected `true` or `false` Apply class live.
moderation_fail_on_shared_proxy = true
# Maximum sessions affected by one bounded moderation action 1 through 1000 Apply class live.
moderation_maximum_mass_targets = 100
# Maximum stored moderation reason length 1 through 2048 Apply class live.
moderation_maximum_reason_length = 512
# Maximum sessions resolved from one address 1 through 100 Apply class live.
moderation_shared_address_hard_cap = 10
