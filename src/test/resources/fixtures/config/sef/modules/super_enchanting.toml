# Controls super enchanting behavior, presentation, bounds, storage, and diagnostics.
# Generated schema version 1.
# This file cannot grant permissions or execute commands.
schema_version = 1
module_id = "super_enchanting"
documentation_version = 2

[module]
# Enables the module after dependency validation. `true` or `false` Apply class live.
enabled = true
# Defines truthful behavior while this module is disabled. `command_unavailable`, `provider_fallback`, `read_only` Apply class live.
disabled_behavior = "command_unavailable"

[gui]
# Selects enhanced GUI presentation without changing command access. `command_only`, `gui_preferred`, `inherit`, `off`, `on` Apply class live.
mode = "inherit"
# Allows eligible bare command routes to prefer a dedicated workflow. `true` or `false` Apply class live.
bare_command_opens = true
# Selects the stable default workflow page. 1 through 64 characters, pattern `[a-z0-9_]+` Apply class live.
default_page = "overview"

[limits]
# Bounds persisted records owned by this module. 1 through 1000000 Apply class live.
maximum_records = 10000
# Bounds command and GUI result pages. 4 through 100 Apply class live.
maximum_page_size = 45

[rate]
# Bounds admission attempts independently of permission cooldown duration. 1 through 10000 Apply class live.
maximum_actions_per_minute = 300

[storage]
# Defines bounded data retention where the module owns persistent records. 0 through 3650 Apply class live.
retention_days = 30

[failure]
# Defines provider and validation failure behavior. `fail_closed`, `previous_known_good`, `read_only` Apply class live.
mode = "previous_known_good"

[audit]
# Defines the minimum audit class for module actions. `admin_action`, `destructive`, `metadata_only`, `none` Apply class live.
class = "metadata_only"
# Defines the module redaction class. `security_critical`, `sensitive`, `standard` Apply class live.
redaction = "standard"

[safety]
# Defines the smallest nonzero level selected by the virtual workstation. 1 through 1000000 Apply class live.
minimum_level = 1
# Defines the administrative enchantment hard ceiling. 1 through 1000000 Apply class live.
maximum_level = 1000
# Allows separately permitted levels above the enchantment vanilla maximum. `true` or `false` Apply class live.
allow_unsafe_levels = true
# Allows separately permitted arbitrary item enchanting. `true` or `false` Apply class live.
allow_arbitrary_items = true
# Allows separately permitted incompatible combinations. `true` or `false` Apply class live.
allow_incompatible = true

[shortcuts]
# Requests the collision aware set shortcut. `true` or `false` Apply class restart_required.
enable_set = true

[confirmation]
# Defines the lifetime of a destructive enchantment confirmation token. 5 through 600 Apply class live.
seconds = 60

[runtime]
# Enable the permission gated administrative enchant command. `true` or `false` Apply class restart_required.
enable_administrative_enchanting = true
# Enable the /set alias for /superenchantingtable `true` or `false` Apply class restart_required.
enable_super_enchanting_table_alias = true
# Super enchanting table (/superenchantingtable, /set) `true` or `false` Apply class restart_required.
enable_super_enchanting_table_command = true
# Show enchantments that do not normally support the held item and allow incompatible combinations `true` or `false` Apply class live.
super_enchanting_allow_unsafe = false
# Highest level the super enchanting table can apply. 1 through 1000000 Apply class live.
super_enchanting_max_level = 1000
# Lowest nonzero level the super enchanting table can apply. 1 through 1000000 Apply class live.
super_enchanting_min_level = 1
