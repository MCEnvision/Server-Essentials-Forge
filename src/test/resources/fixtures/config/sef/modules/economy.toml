# Controls economy behavior, presentation, bounds, storage, and diagnostics.
# Generated schema version 1.
# This file cannot grant permissions or execute commands.
schema_version = 1
module_id = "economy"
documentation_version = 2

[module]
# Enables the module after dependency validation. `true` or `false` Apply class live.
enabled = true
# Defines truthful behavior while this module is disabled. `command_unavailable`, `provider_fallback`, `read_only` Apply class live.
disabled_behavior = "command_unavailable"

[gui]
# Selects enhanced GUI presentation without changing command access. `command_only`, `gui_preferred`, `inherit`, `off`, `on` Apply class live.
mode = "inherit"
# Allows eligible bare command routes to prefer a dedicated workflow. `true` or `false` Apply class live.
bare_command_opens = true
# Selects the stable default workflow page. 1 through 64 characters, pattern `[a-z0-9_]+` Apply class live.
default_page = "overview"

[limits]
# Bounds persisted records owned by this module. 1 through 1000000 Apply class live.
maximum_records = 10000
# Bounds command and GUI result pages. 4 through 100 Apply class live.
maximum_page_size = 45

[rate]
# Bounds admission attempts independently of permission cooldown duration. 1 through 10000 Apply class live.
maximum_actions_per_minute = 300

[storage]
# Defines bounded data retention where the module owns persistent records. 0 through 3650 Apply class live.
retention_days = 30

[failure]
# Defines provider and validation failure behavior. `fail_closed`, `previous_known_good`, `read_only` Apply class live.
mode = "previous_known_good"

[audit]
# Defines the minimum audit class for module actions. `admin_action`, `destructive`, `metadata_only`, `none` Apply class live.
class = "metadata_only"
# Defines the module redaction class. `security_critical`, `sensitive`, `standard` Apply class live.
redaction = "standard"

[runtime]
# Allow payments to unambiguous known offline identities `true` or `false` Apply class restart_required.
economy_allow_offline_payments = true
# Allow a player to pay the same account `true` or `false` Apply class restart_required.
economy_allow_self_payments = false
# Entries shown per balance top page 1 through 100 Apply class restart_required.
economy_balance_top_page_size = 10
# Comma separated action cost mappings. Components are fixed, use, target, distance, and item. Example sef:teleport.spawn=5.00,sef:teleport.spawn@distance=0.01 0 through 8192 characters Apply class restart_required.
economy_command_costs = ""
# Payments at or above this value require confirmation when the player preference is enabled. Zero disables the threshold 0 through 9000000000000000 Apply class restart_required.
economy_confirmation_threshold = 100000
# Stable currency identifier 0 through 8192 characters Apply class restart_required.
economy_currency = "coin"
# Display only currency prefix 0 through 8192 characters Apply class restart_required.
economy_currency_symbol = "$"
# Opening account balance in minor units -9000000000000000 through 9000000000000000 Apply class restart_required.
economy_default_balance = 0
# Comma separated enabled sign types 0 through 8192 characters Apply class restart_required.
economy_enabled_sign_types = "balance,buy,sell,trade,free,disposal,kit,heal,repair,time,weather,warp"
# Registered external provider id. Empty selects the highest priority adapter 0 through 8192 characters Apply class restart_required.
economy_external_provider = ""
# Transactions shown per history page 1 through 100 Apply class restart_required.
economy_history_page_size = 10
# Maximum native accounts 1 through 1000000 Apply class restart_required.
economy_maximum_accounts = 100000
# Maximum account balance in minor units 1 through 9000000000000000 Apply class restart_required.
economy_maximum_balance = 1000000000000000
# Maximum accounts accepted by one import once operation 1 through 1000000 Apply class restart_required.
economy_maximum_import_accounts = 100000
# Maximum retained native ledger entries 100 through 1000000 Apply class restart_required.
economy_maximum_ledger_entries = 100000
# Maximum crash recoverable pending command costs 1 through 100000 Apply class restart_required.
economy_maximum_pending_costs = 10000
# Maximum registered economy sign sides 1 through 1000000 Apply class restart_required.
economy_maximum_signs = 100000
# Maximum value of one transaction in minor units 1 through 9000000000000000 Apply class restart_required.
economy_maximum_transaction = 1000000000000
# Maximum server defined item worth entries 1 through 100000 Apply class restart_required.
economy_maximum_worth_entries = 10000
# Minimum account balance in minor units. Use zero to disallow debt -9000000000000000 through 9000000000000000 Apply class restart_required.
economy_minimum_balance = 0
# Decimal minor units used when parsing and formatting 0 through 8 Apply class restart_required.
economy_minor_units = 2
# native, external, disabled, or import_once 0 through 8192 characters Apply class restart_required.
economy_provider_mode = "native"
# Native or adapter backed economy, worth, sell, and command costs `true` or `false` Apply class restart_required.
enable_economy = true
