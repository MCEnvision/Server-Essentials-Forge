# Controls gui behavior, presentation, bounds, storage, and diagnostics.
# Generated schema version 1.
# This file cannot grant permissions or execute commands.
schema_version = 1
module_id = "gui"
documentation_version = 2

[module]
# Enables the module after dependency validation. `true` or `false` Apply class live.
enabled = true
# Defines truthful behavior while this module is disabled. `command_unavailable`, `provider_fallback`, `read_only` Apply class live.
disabled_behavior = "command_unavailable"

[gui]
# Selects enhanced GUI presentation without changing command access. `auto`, `off`, `on` Apply class live.
mode = "auto"
# Allows eligible bare command routes to prefer a dedicated workflow. `true` or `false` Apply class live.
bare_command_opens = true
# Selects the stable default workflow page. 1 through 64 characters, pattern `[a-z0-9_]+` Apply class live.
default_page = "overview"

[limits]
# Bounds persisted records owned by this module. 1 through 1000000 Apply class live.
maximum_records = 10000
# Bounds command and GUI result pages. 4 through 100 Apply class live.
maximum_page_size = 45

[rate]
# Bounds admission attempts independently of permission cooldown duration. 1 through 10000 Apply class live.
maximum_actions_per_minute = 300

[storage]
# Defines bounded data retention where the module owns persistent records. 0 through 3650 Apply class live.
retention_days = 30

[failure]
# Defines provider and validation failure behavior. `fail_closed`, `previous_known_good`, `read_only` Apply class live.
mode = "previous_known_good"

[audit]
# Defines the minimum audit class for module actions. `admin_action`, `destructive`, `metadata_only`, `none` Apply class live.
class = "metadata_only"
# Defines the module redaction class. `security_critical`, `sensitive`, `standard` Apply class live.
redaction = "standard"

[sessions]
# Bounds privileged enhanced workflow sessions. 1 through 4 Apply class live.
maximum_open_per_player = 1
# Expires inactive enhanced workflow sessions. 10 through 1800 Apply class live.
timeout_seconds = 120
# Bounds server held typed draft state per player. 4096 through 1048576 Apply class live.
maximum_draft_bytes = 262144

[reminder]
# Enables the optional client enhancement reminder. `true` or `false` Apply class live.
enabled = true
# Bounds repeated enhancement reminders. 1 through 8760 Apply class live.
minimum_interval_hours = 24

[runtime]
# Enable optional client capability negotiation and enhanced screens `true` or `false` Apply class restart_required.
enable_enhanced_gui = false
# Maximum entries encoded into one server page 1 through 100 Apply class live.
gui_maximum_panel_entries = 45
# Maximum accepted GUI requests from one connection each second 1 through 100 Apply class live.
gui_panel_requests_per_second = 20
# Lifetime of one server authoritative panel snapshot 10 through 600 Apply class live.
gui_panel_session_seconds = 60
# Reminder audience. all, players, or staff 0 through 8192 characters Apply class live.
gui_reminder_audience = "all"
# Delay after login before a fallback reminder 0 through 3600 Apply class live.
gui_reminder_delay_seconds = 5
# Remind command fallback players that the optional client exists `true` or `false` Apply class live.
gui_reminder_enabled = true
# Minimum hours between reminders. Zero means once per configured revision 0 through 8760 Apply class live.
gui_reminder_frequency_hours = 0
# Increment to show a once per revision reminder again 1 through 1000000 Apply class live.
gui_reminder_revision = 1
